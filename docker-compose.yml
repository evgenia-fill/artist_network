services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pixelflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelflow}
      POSTGRES_DB: pixelflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: pixelflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pixelflow}
    ports:
      - "5672:5672"
      - "15672:15672"
volumes:
  pgdata: